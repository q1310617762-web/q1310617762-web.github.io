name: 自动更新新番列表

# 每天定时抓取 B 站番剧时间线并提交到仓库；
# 托管平台（Vercel / Netlify / GitHub Pages）检测到提交后会自动重新构建部署。
# 若使用 GitHub Pages，请自行追加 deploy 步骤或使用 Pages 官方部署 Action。

on:
  schedule:
    # UTC 时间；对应北京时间约 02:00 / 10:00 / 18:00
    - cron: '0 18,2,10 * * *'
  workflow_dispatch: # 也可在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取新番数据
        run: node scripts/fetch-anime.mjs

      - name: 提交更新（如有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/anime-data.json
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore(anime): 自动更新新番列表 [skip ci]"
            git push
            echo "已提交并推送"
          fi
